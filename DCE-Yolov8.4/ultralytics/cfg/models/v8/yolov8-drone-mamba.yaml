# YOLOv8-Ultimate: DCE + ERB + Mamba + CLIP + LSK
# 专为 VisDrone 小目标检测优化的"六边形战士"
nc: 10
scales: 
  n: [0.33, 1.00, 1024]

backbone:
  # ===================== P1/2 (Stride 2) =====================
  - [-1, 1, Conv, [64, 3, 2]]                 # 0: -> 64ch
  - [-1, 1, DCE, [64]]                        # 1: -> 64ch
  
  # ===================== P2/4 (Stride 4) =====================
  - [-1, 1, Conv, [128, 3, 2]]                # 2: -> 128ch
  - [-1, 1, DCE, [128]]                       # 3: -> 128ch
  - [-1, 1, ERB, [128, 1]]                    # 4: -> 128ch ★ P2 输出点

  # ===================== P3/8 (Stride 8) =====================
  - [-1, 1, SCDown, [256, 3, 2]]              # 5: -> 256ch
  - [-1, 1, C2f_VSS, [256, 1]]                # 6: -> 256ch (Mamba)
  - [-1, 1, C2f_CLIP, [256, 1, False, 1, 0.5, 10]]  # 7: -> 256ch ★ P3 输出点

  # ===================== P4/16 (Stride 16) =====================
  - [-1, 1, SCDown, [512, 3, 2]]              # 8: -> 512ch
  - [-1, 1, C2f_VSS, [512, 1]]                # 9: -> 512ch (Mamba)
  - [-1, 1, C2f_CLIP, [512, 1, False, 1, 0.5, 10]]  # 10: -> 512ch
  - [-1, 1, SPPF, [512, 5]]                   # 11: -> 512ch ★ P4 输出点

head:
  # ===================== Top-down: P4 -> P3 =====================
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 12: 512ch (上采样)
  - [[-1, 7], 1, Concat, [1]]                       # 13: 512 + 256 = 768ch
  - [-1, 1, LSKBlock, [256]]                        # 14: 768 -> 256ch ★ LSK 大核注意力

  # ===================== Top-down: P3 -> P2 =====================
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]     # 15: 256ch (上采样)
  - [[-1, 4], 1, Concat, [1]]                       # 16: 256 + 128 = 384ch
  - [-1, 1, Conv, [128, 1, 1]]                      # 17: 384 -> 128ch (通道对齐)
  - [-1, 1, ERB, [128, 1]]                          # 18: -> 128ch ★ Detect P2

  # ===================== Bottom-up: P2 -> P3 =====================
  - [-1, 1, SCDown, [256, 3, 2]]                   # 19: 128 -> 256ch (下采样)
  - [[-1, 14], 1, Concat, [1]]                     # 20: 256 + 256 = 512ch
  - [-1, 1, Conv, [256, 1, 1]]                     # 21: 512 -> 256ch (通道对齐)
  - [-1, 1, ERB, [256, 1]]                         # 22: -> 256ch ★ Detect P3

  # ===================== Bottom-up: P3 -> P4 =====================
  - [-1, 1, SCDown, [512, 3, 2]]                   # 23: 256 -> 512ch (下采样)
  - [[-1, 11], 1, Concat, [1]]                     # 24: 512 + 512 = 1024ch
  - [-1, 1, Conv, [512, 1, 1]]                     # 25: 1024 -> 512ch (通道对齐)
  - [-1, 1, C2f_VSS, [512, 1]]                     # 26: -> 512ch ★ Detect P4

  # ===================== Detect Head =====================
  - [[18, 22, 26], 1, Detect, [nc]]