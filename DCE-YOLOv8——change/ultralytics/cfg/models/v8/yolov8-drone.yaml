# Ultralytics YOLOv8 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolov8
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPS
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS
  m: [0.67, 0.75, 768] # YOLOv8m summary: 169 layers, 25902640 parameters, 25902624 gradients, 79.3 GFLOPS
  l: [1.00, 1.00, 512] # YOLOv8l summary: 209 layers, 43691520 parameters, 43691504 gradients, 165.7 GFLOPS
  x: [1.00, 1.25, 512] # YOLOv8x summary: 209 layers, 68229648 parameters, 68229632 gradients, 258.5 GFLOPS

# 2. Backbone (主干网络) - 手术点：砍掉 P5，嵌入 DCE/ERB
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2 (普通卷积)

  # 【手术点1】论文用 DCE 模块提取浅层微小特征 (对应 P2)
  - [-1, 1, DCE, [128, 3, 2]]  # 1-P2/4 (128通道, 3x3核, stride 2)

  # 【手术点2】论文用 ERB 替换 C2f 以轻量化
  - [-1, 1, ERB, [128, 1]]     # 2 (P2 特征处理)

  - [-1, 1, DCE, [256, 3, 2]]  # 3-P3/8 (下采样到 P3)
  - [-1, 2, ERB, [256, 2]]     # 4 (P3 特征处理)

  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (这里论文叫 SCDown，暂用 Conv 替代)
  - [-1, 2, ERB, [512, 2]]     # 6 (P4 特征处理)

  # 【手术点3】关键！原版这里还有一层 Conv(stride 2) 和 C2f 生成 P5。
  # 我们直接在这里加上 SPPF 结束 Backbone，彻底抛弃 P5 (B5 Block)。
  - [-1, 1, SPPF, [512, 5]]    # 7 (Backbone 结束，输出 P4)

# 3. Head (头部/颈部) - 手术点：引入 P2 层进行上采样融合
head:
  # --- Top-down path (从深层往浅层传) ---
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 8 (P4 -> P3 尺寸)
  - [[-1, 4], 1, Concat, [1]]                   # 9 (拼接 Backbone 的 P3)
  - [-1, 1, ERB, [256, 1]]                      # 10 (融合后的 P3)

  # 【手术点4】继续上采样去融合 P2！(原版 YOLOv8 到这就停了)
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 11 (P3 -> P2 尺寸)
  - [[-1, 2], 1, Concat, [1]]                  # 12 (拼接 Backbone 的 P2 - 第2层)
  - [-1, 1, ERB, [128, 1]]                     # 13 (融合后的 P2 - 特征图极大，极小目标都在这)

  # --- Bottom-up path (从浅层往深层传) ---
  - [-1, 1, Conv, [128, 3, 2]]                 # 14 (P2 -> P3)
  - [[-1, 10], 1, Concat, [1]]                 # 15 (拼接回 P3)
  - [-1, 1, ERB, [256, 1]]                     # 16 (输出 P3 给检测头)

  - [-1, 1, Conv, [256, 3, 2]]                 # 17 (P3 -> P4)
  - [[-1, 7], 1, Concat, [1]]                  # 18 (拼接回 P4)
  - [-1, 1, ERB, [512, 1]]                     # 19 (输出 P4 给检测头)

  # 【手术点5】检测头 Detect
  # 这里的输入变成了 [13, 16, 19]，分别对应 P2, P3, P4。
  # 原版是 P3, P4, P5。这意味着我们现在的检测器对“像素级”小目标极其敏感。
  - [[13, 16, 19], 1, Detect, [nc]]
