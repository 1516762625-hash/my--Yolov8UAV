# DCE-YOLOv8 Corrected Configuration
# Based on Paper Table 2 structure
nc: 10
scales:
  n: [0.33, 1.00, 1024] # Width=1.00 (Base Channels: 64, 128, 256...)

backbone:
  # [from, repeats, module, args]
  # Layer 0: Stem Conv (Downsample) -> 64ch
  - [-1, 1, Conv, [64, 3, 2]]

  # Layer 1: DCE (Feature) -> 64ch (保持不变)
  - [-1, 1, DCE, [64]]

  # Layer 2: Conv (Downsample P2) -> 128ch
  - [-1, 1, Conv, [128, 3, 2]]

  # Layer 3: DCE (Feature) -> 128ch
  - [-1, 1, DCE, [128]]

  # Layer 4: ERB (Feature P2) -> 128ch
  - [-1, 1, ERB, [128, 1]]

  # Layer 5: SCDown (Downsample P3) -> 128ch (论文Table 2写法如此，或者是256?)
  # 修正：通常下采样翻倍通道。Table 2 确实有些非主流。
  # 我们按标准逻辑：P2(128) -> SCDown -> P3(256)
  - [-1, 1, SCDown, [256, 3, 2]]

  # Layer 6: ERB (Feature P3) -> 256ch
  - [-1, 2, ERB, [256, 2]]

  # Layer 7: SCDown (Downsample P4) -> 512ch
  - [-1, 1, SCDown, [512, 3, 2]]

  # Layer 8: ERB (Feature P4) -> 512ch
  - [-1, 2, ERB, [512, 2]]

  # Layer 9: SPPF (Backbone End)
  - [-1, 1, SPPF, [512, 5]]

head:
  # Neck - Upsample & Fusion
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 (Cat P3)
  - [-1, 1, ERB, [256, 1]] # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 (Cat P2 - Layer 4)
  - [-1, 1, ERB, [128, 1]] # 15 (Tiny Scale Feature)

  # Neck - Downsample Path
  - [-1, 1, SCDown, [256, 3, 2]] # 16 (P2 -> P3)
  - [[-1, 12], 1, Concat, [1]] # 17
  - [-1, 1, ERB, [256, 1]] # 18

  - [-1, 1, SCDown, [512, 3, 2]] # 19 (P3 -> P4)
  - [[-1, 9], 1, Concat, [1]] # 20
  - [-1, 1, ERB, [512, 1]] # 21

  # Detect Head (P2, P3, P4)
  - [[15, 18, 21], 1, Detect, [nc]]